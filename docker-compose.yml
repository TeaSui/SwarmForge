services:
  localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,dynamodb
      - DEFAULT_REGION=ap-southeast-1
      - SQS_ENDPOINT_STRATEGY=off
    volumes:
      - "./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh"
      - "localstack_data:/var/lib/localstack"

  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - APP_ENV=local
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/swarmforge-events
      - DYNAMODB_IDEMPOTENCY_TABLE=swarmforge-idempotency
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=ap-southeast-1
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_PROFILE=
    depends_on:
      localstack:
        condition: service_healthy
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--log-level", "info"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build: .
    env_file: .env
    environment:
      - APP_ENV=local
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/swarmforge-events
      - DYNAMODB_IDEMPOTENCY_TABLE=swarmforge-idempotency
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=ap-southeast-1
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_PROFILE=
      - SWARMFORGE_MOCK_EXTERNAL=true
      - SWARMFORGE_PRIMARY_LLM=anthropic
      - CREWAI_TRACING_ENABLED=false
      - SWARMFORGE_CREW_STAGE_ATTEMPTS=1
    depends_on:
      localstack:
        condition: service_healthy
    command: ["python", "worker.py"]

volumes:
  localstack_data:
